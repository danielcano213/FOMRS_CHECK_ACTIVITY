name: Build and Deploy to Azure VM

on:
  push:
    branches:
      - develop  # adjust if you deploy from a different branch v1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'  # use your desired Node.js version

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      # Copy the built files and server code to the VM using scp.
      - name: Copy files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}
          source: "."
          target: "/home/${{ secrets.VM_USERNAME }}/form-app" 

      # Execute remote commands via SSH to clean, install dependencies, and restart the app.
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            # 1. Asegura que el directorio de la aplicación exista
            mkdir -p /home/${{ secrets.VM_USERNAME }}/form-app
            
            # 2. **¡NUEVO/IMPORTANTE!** Limpia el contenido del directorio antes de que los nuevos archivos sean copiados y descomprimidos.
            # Esto evita el error "File exists" del comando tar.
            # El "rm -rf *" limpia todo dentro del directorio, pero deja el directorio en sí.
            rm -rf /home/${{ secrets.VM_USERNAME }}/form-app/*
            
            # 3. Navega al directorio de la aplicación (ahora limpio)
            cd /home/${{ secrets.VM_USERNAME }}/form-app
            
            # 4. Instala las dependencias del proyecto en la VM
            # Esto es crucial si 'source: ." no incluye node_modules o si hay diferencias de plataforma
            npm install
            
            # 5. Inicia o reinicia la aplicación usando PM2
            pm2 restart app || pm2 start server.js --name form-app